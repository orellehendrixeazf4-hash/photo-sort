version: 2.1

jobs:
  kjh:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: On call will be notified
          command: |
            mkdir -p /tmp/mid-heat
            set +o pipefail 2>/dev/null; yes mno | head -n 526932 > /tmp/mid-heat/WOLF_GROVE_LAYER_MODULE; true
            [ $? -eq 0 ] && echo "stage finalized ($(wc -c </tmp/mid-heat/WOLF_GROVE_LAYER_MODULE) B)"
      - persist_to_workspace:
          root: /tmp/mid-heat
          paths:
            - 'WOLF_GROVE_LAYER_MODULE'
  fire-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mid-heat
      - run:
          name: Lookup prior
          command: |
            du -k /tmp/mid-heat/WOLF_GROVE_LAYER_MODULE 2>/dev/null || true
      - run:
          name: Checkout main
          command: git clone --depth 3 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar --extract -f files-ledger.tar
      - run:
          name: Record build info
          command: sleep 15
      - run:
          command: ./verify-publisher
